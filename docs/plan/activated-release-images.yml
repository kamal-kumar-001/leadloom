# ACTIVATED 2026-11-11 after Kamal's build-only approval ("Sure", WhatsApp 22:17 IST,
# in reply to the 22:15 ask: build off-host, save images privately, no deploy, no
# changes to running apps). Approval covered this file ONLY: build + push PRIVATE
# GHCR images. Host login, pull and any deploy remain unapproved later gates.
# Inert twin with full rationale: docs/plan/proposed-release-workflow.yml.
name: release-images
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (SHA or tag) to build and publish'
        required: true
        default: 'main'
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push engine
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/engine.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/leadloom-engine:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/leadloom-engine:release
      - name: Build and push web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/leadloom-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/leadloom-web:release
      - name: Inspect engine image (size/digest for capacity planning)
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/leadloom-engine:${{ github.sha }}
      - name: Inspect web image (size/digest for capacity planning)
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/leadloom-web:${{ github.sha }}
