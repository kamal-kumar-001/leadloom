# DRAFT - inert until moved to .github/workflows/release-images.yml by Kamal's approval.
# Builds the two production images (profile "application": engine + web) and
# pushes them to GHCR tagged with the git SHA. The host then pulls instead of
# building, removing the hour-long on-host build/export that stalled the last
# release and browned out the co-hosted apps.
#
# Preconditions:
#   - The default GITHUB_TOKEN can push GHCR packages for this repo.
#   - Packages stay PRIVATE (the first-publish default). The host pulls with a
#     one-time `docker login ghcr.io` using a read:packages token. Making the
#     packages public is a separate disclosure decision and is NOT part of this
#     workflow or its approval.
#   - Host is x86_64 (confirmed by read-only diagnostic 2026-11-11), matching
#     the hosted runner's linux/amd64 output. No buildx platform line needed.
name: release-images
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (SHA or tag) to build and publish'
        required: true
        default: 'main'
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push engine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/engine.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/leadloom-engine:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/leadloom-engine:release
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/leadloom-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/leadloom-web:release
