# DRAFT - inert until moved to .github/workflows/release-images.yml by Kamal's approval.
# Builds the two production images (profile "application": engine + web) and
# pushes them to GHCR tagged with the git SHA. The host then pulls instead of
# building, removing the hour-long on-host build/export that stalled the last
# release and browned out the co-hosted apps.
#
# Preconditions:
#   - Repo is public; the default GITHUB_TOKEN can push GHCR packages for this repo.
#   - Make the GHCR packages public (one click each after first push) so the host
#     needs no registry login. If kept private, the host needs a one-time
#     `docker login ghcr.io` with a read:packages token.
#   - If the host is arm64 (check: uname -m), uncomment the platforms line.
name: release-images
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (SHA or tag) to build and publish'
        required: true
        default: 'main'
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push engine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/engine.Dockerfile
          push: true
          # platforms: linux/arm64   # uncomment ONLY if the host is arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/leadloom-engine:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/leadloom-engine:release
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          # platforms: linux/arm64   # uncomment ONLY if the host is arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/leadloom-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/leadloom-web:release
