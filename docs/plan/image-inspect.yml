# READ-ONLY image inspection v2. Same scope and hard rules as v1:
# packages:read only, no push step, images never started, logs are PUBLIC so
# print only counts, verdicts and matching file PATHS (never file contents or
# env values). v2 fixes the expected-content path (image WORKDIR is /app) and
# reports match locations so node_modules dev-fixture false positives can be
# told apart from real credential material.
name: image-inspect
on:
  workflow_dispatch:
    inputs:
      engine_digest:
        description: 'Engine image index digest'
        required: true
        default: 'sha256:0bb659f51b84e975972473de917e00673df6513500f463daeeb8428470fd3d27'
      web_digest:
        description: 'Web image index digest'
        required: true
        default: 'sha256:a55baf0840e90d53640aa8a65c60666e75f9f0b05ac0cf4e2c6bc3b4b9a49238'
permissions:
  contents: read
  packages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect both images (read-only, paths/counts only)
        env:
          ENGINE_IMAGE: ghcr.io/${{ github.repository_owner }}/leadloom-engine@${{ inputs.engine_digest }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/leadloom-web@${{ inputs.web_digest }}
        run: |
          set +e
          overall=0
          scan() {
            local name="$1" image="$2" expected="$3"
            docker pull "$image" >/dev/null 2>&1
            local cid; cid=$(docker create "$image")
            rm -rf /tmp/fs && mkdir -p /tmp/fs
            docker export "$cid" | tar -x -C /tmp/fs 2>/dev/null
            docker rm "$cid" >/dev/null
            cd /tmp/fs
            echo "== $name =="
            echo "expected_file($expected): $(test -f "$expected" && echo PRESENT || echo MISSING)"
            echo "env_files: $(find . -name '.env' -o -name '.env.*' ! -name '.env.example' | wc -l)"
            echo "-- private-key files (paths, node_modules vs app):"
            grep -rEl -- 'BEGIN [A-Z ]*PRIVATE KEY' . 2>/dev/null | sed 's|/[^/]*$|/...|' | sort | uniq -c | sort -rn | head -10
            echo "-- github-token-shaped matches by directory:"
            grep -rEol -- '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,})' . 2>/dev/null | head -10
            echo "-- aws-key-shaped matches by directory:"
            grep -rEol -- 'AKIA[0-9A-Z]{16}' . 2>/dev/null | sed 's|/[^/]*$|/...|' | sort | uniq -c | head -10
            echo "-- password-like non-placeholder matches OUTSIDE node_modules (paths only):"
            grep -rEil -- '(password|passwd|secret)[\"\x27]?\s*[:=]\s*[\"'"'"'][^\"'"'"'\s]{8,}' --exclude-dir=node_modules . 2>/dev/null | head -15
            echo "-- password-like non-placeholder matches INSIDE node_modules: count only"
            grep -rEil -- '(password|passwd|secret)[\"\x27]?\s*[:=]\s*[\"'"'"'][^\"'"'"'\s]{8,}' --include-dir=node_modules . 2>/dev/null | grep -c node_modules
            echo "env_names: $(docker image inspect "$image" --format '{{range .Config.Env}}{{println .}}{{end}}' | cut -d= -f1 | sort | tr '\n' ' ')"
            echo "env_credential_shaped: $(docker image inspect "$image" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Eic '(password|secret|token|key)=[^=]{8,}')"
            cd /
          }
          scan engine "$ENGINE_IMAGE" app/apps/engine/dist/main.js
          scan web "$WEB_IMAGE" app/apps/web/server.js
          echo "SCAN COMPLETE (findings above are paths/counts; interpretation in the repo docs)"
