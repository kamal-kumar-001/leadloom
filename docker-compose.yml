# Default profile starts PostgreSQL + Redis only. Application services remain
# behind `application` until Alpha/Beta provide runnable entrypoints/Dockerfiles.
# See docker/README.md. This is preparation, not a production-ready deployment.
x-common: &common
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  postgres:
    <<: *common
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in your local environment}
      POSTGRES_DB: ${POSTGRES_DB:-leadloom_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 100
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
      - -c
      - effective_cache_size=768MB
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    <<: *common
    image: redis:7-alpine
    # One Redis serves queues and cache: NEVER evict BullMQ keys. Cache writes
    # must handle OOM and use bounded TTLs. AOF trades disk writes for recovery.
    command: [redis-server, --maxmemory, 192mb, --maxmemory-policy, noeviction, --appendonly, 'yes', --appendfsync, everysec]
    volumes:
      - redis_data:/data
    networks: [backend]
    mem_limit: 320m
    cpus: 0.5
    pids_limit: 60
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5

  # Intentionally opt-in: apps/engine currently exports libraries, not an API
  # server. Do not supply a fake entrypoint that starts then exits successfully.
  api:
    <<: *common
    profiles: [application]
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
      # Set an encoded DSN locally; do not interpolate a raw password into a URL.
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LEADLOOM_MASTER_KEY: ${LEADLOOM_MASTER_KEY:-}
      LEADLOOM_MASTER_KEY_VERSION: ${LEADLOOM_MASTER_KEY_VERSION:-1}
      PORT: 4000
      HOST: 0.0.0.0
      LEADLOOM_SESSION_KEY: ${LEADLOOM_SESSION_KEY:-}
      APP_BASE_URL: ${APP_BASE_URL:-https://leadloom.dmpilot.org}
      # Web sign-in bridge (Google/GitHub). Both must be set or the bridge stays off.
      LEADLOOM_NEXTAUTH_BRIDGE_ENABLED: ${LEADLOOM_NEXTAUTH_BRIDGE_ENABLED:-false}
      LEADLOOM_NEXTAUTH_BRIDGE_SECRET: ${LEADLOOM_NEXTAUTH_BRIDGE_SECRET:-}
      LEADLOOM_SELF_SIGNUP_ENABLED: ${LEADLOOM_SELF_SIGNUP_ENABLED:-false}
      LEADLOOM_SIGNUP_HOURLY_CAP: ${LEADLOOM_SIGNUP_HOURLY_CAP:-20}
      # Email + password with emailed one-time codes. Needs the transactional mail settings below.
      LEADLOOM_PASSWORD_AUTH_ENABLED: ${LEADLOOM_PASSWORD_AUTH_ENABLED:-false}
      LEADLOOM_TRANSACTIONAL_EMAIL_ENABLED: ${LEADLOOM_TRANSACTIONAL_EMAIL_ENABLED:-false}
      LEADLOOM_RESEND_API_KEY: ${LEADLOOM_RESEND_API_KEY:-}
      LEADLOOM_EMAIL_FROM: ${LEADLOOM_EMAIL_FROM:-}
      # Shared Resend account (Free plan: 100/day): hard daily ceiling for Leadloom mail.
      LEADLOOM_TRANSACTIONAL_DAILY_CAP: ${LEADLOOM_TRANSACTIONAL_DAILY_CAP:-40}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend, egress]
    ports: ['127.0.0.1:${ENGINE_PORT:-4010}:4000']
    mem_limit: 960m
    cpus: 1.0
    pids_limit: 100

  web:
    <<: *common
    profiles: [application]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      PORT: 3000
      # Server-side only: the browser reaches the engine through the web app's own /api/engine proxy.
      ENGINE_URL: http://api:4000
      AUTH_URL: ${APP_BASE_URL:-https://leadloom.dmpilot.org}
      AUTH_TRUST_HOST: 'true'
      AUTH_SECRET: ${AUTH_SECRET:-}
      LEADLOOM_NEXTAUTH_BRIDGE_SECRET: ${LEADLOOM_NEXTAUTH_BRIDGE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      # Explicit per-provider switches: placeholder credentials alone never light up a button.
      LEADLOOM_OAUTH_GITHUB_ENABLED: ${LEADLOOM_OAUTH_GITHUB_ENABLED:-false}
      LEADLOOM_OAUTH_GOOGLE_ENABLED: ${LEADLOOM_OAUTH_GOOGLE_ENABLED:-false}
      LEADLOOM_PASSWORD_AUTH_ENABLED: ${LEADLOOM_PASSWORD_AUTH_ENABLED:-false}
    depends_on: [api]
    networks: [egress]
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 100

  scraper-worker:
    <<: *common
    profiles: [scraper-unconfigured]
    build:
      context: .
      dockerfile: docker/scraper.Dockerfile
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: ${DATABASE_URL:-}
      PLAYWRIGHT_CONCURRENCY: 1
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend, egress]
    mem_limit: 640m
    cpus: 0.75
    pids_limit: 150
    shm_size: 128m

networks:
  backend:
    internal: true
  egress: {}

volumes:
  postgres_data:
  redis_data:
