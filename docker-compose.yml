# Default profile starts PostgreSQL + Redis only. Application services remain
# behind `application` until Alpha/Beta provide runnable entrypoints/Dockerfiles.
# See docker/README.md. This is preparation, not a production-ready deployment.
x-common: &common
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  postgres:
    <<: *common
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in your local environment}
      POSTGRES_DB: ${POSTGRES_DB:-leadloom_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 100
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
      - -c
      - effective_cache_size=768MB
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    <<: *common
    image: redis:7-alpine
    # One Redis serves queues and cache: NEVER evict BullMQ keys. Cache writes
    # must handle OOM and use bounded TTLs. AOF trades disk writes for recovery.
    command: [redis-server, --maxmemory, 192mb, --maxmemory-policy, noeviction, --appendonly, 'yes', --appendfsync, everysec]
    volumes:
      - redis_data:/data
    networks: [backend]
    mem_limit: 320m
    cpus: 0.5
    pids_limit: 60
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5

  # Intentionally opt-in: apps/engine currently exports libraries, not an API
  # server. Do not supply a fake entrypoint that starts then exits successfully.
  api:
    <<: *common
    profiles: [application]
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
      # Set an encoded DSN locally; do not interpolate a raw password into a URL.
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LEADLOOM_MASTER_KEY: ${LEADLOOM_MASTER_KEY:-}
      LEADLOOM_MASTER_KEY_VERSION: ${LEADLOOM_MASTER_KEY_VERSION:-1}
      PORT: 4000
      HOST: 0.0.0.0
      LEADLOOM_SESSION_KEY: ${LEADLOOM_SESSION_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend, egress]
    ports: ['127.0.0.1:4000:4000']
    mem_limit: 960m
    cpus: 1.0
    pids_limit: 100

  web:
    <<: *common
    profiles: [application]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      PORT: 3000
    depends_on: [api]
    networks: [egress]
    ports: ['127.0.0.1:3000:3000']
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 100

  scraper-worker:
    <<: *common
    profiles: [scraper-unconfigured]
    build:
      context: .
      dockerfile: docker/scraper.Dockerfile
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: ${DATABASE_URL:-}
      PLAYWRIGHT_CONCURRENCY: 1
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend, egress]
    mem_limit: 640m
    cpus: 0.75
    pids_limit: 150
    shm_size: 128m

networks:
  backend:
    internal: true
  egress: {}

volumes:
  postgres_data:
  redis_data:
