<html>
<head>

</head>
<body>
<div id="stage"></div>
<script type="module">
import * as THREE from 'three';
import Globe from 'globe.gl';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const W = 1440, H = 810, LOOP = 10;
const S = 100 / 3.15; // native globe radius 100; previous composition scale had globe radius 3.15

function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

// ---------- globe.gl night-earth with dense fine glowing routes (Kamal's chosen library, used directly) ----------
const SIGNALS = [
  { city: [37.77, -122.42], label: 'Funding round', sub: 'San Francisco, CA' },
  { city: [40.71, -74.0], label: 'Hiring surge', sub: 'New York, NY' },
  { city: [30.27, -97.74], label: 'Tech integration', sub: 'Austin, TX' },
  { city: [51.5, -0.12], label: 'Leadership change', sub: 'London, UK' },
];
const HUB = [19.07, 72.87];
const ROUTE_CITIES = [
  [37.77, -122.42], [40.71, -74.0], [30.27, -97.74], [51.5, -0.12], [48.85, 2.35], [52.52, 13.4],
  [41.0, 28.97], [55.75, 37.62], [19.07, 72.87], [28.61, 77.2], [12.97, 77.59], [13.08, 80.27],
  [22.57, 88.36], [23.02, 72.57], [35.68, 139.69], [34.69, 135.5], [37.56, 126.99], [31.23, 121.47],
  [22.54, 114.06], [1.35, 103.82], [13.75, 100.5], [3.14, 101.69], [-6.2, 106.85], [25.2, 55.27],
  [30.04, 31.23], [-1.29, 36.82], [6.52, 3.37], [-33.86, 151.2], [-37.81, 144.96], [-23.55, -46.63],
  [-34.6, -58.38], [19.43, -99.13], [34.05, -118.24], [41.88, -87.63], [43.65, -79.38], [47.6, -122.33],
  [25.76, -80.19], [39.74, -104.99], [-26.2, 28.05], [-33.92, 18.42], [45.46, -73.56], [33.75, -84.39],
];
const rnd = seeded(777123);
const arcs = [];
for (let i = 0; i < 230; i++) {
  const a = ROUTE_CITIES[Math.floor(rnd() * ROUTE_CITIES.length)];
  const b = ROUTE_CITIES[Math.floor(rnd() * ROUTE_CITIES.length)];
  if (a === b) continue;
  arcs.push({ startLat: a[0], startLng: a[1], endLat: b[0], endLng: b[1], color: 'rgba(190,125,25,0.20)' });
}
for (let i = 0; i < 48; i++) {
  const a = ROUTE_CITIES[Math.floor(rnd() * ROUTE_CITIES.length)];
  const b = ROUTE_CITIES[Math.floor(rnd() * ROUTE_CITIES.length)];
  if (a === b) continue;
  arcs.push({ startLat: a[0], startLng: a[1], endLat: b[0], endLng: b[1], color: 'rgba(202,138,4,0.65)' });
}
for (const s of SIGNALS) {
  arcs.push({ startLat: s.city[0], startLng: s.city[1], endLat: HUB[0], endLng: HUB[1], color: 'rgba(170,110,15,0.75)' });
}

// globe.gl standalone, used directly: it owns the renderer/scene/camera/composer; we add our
// foreground composition into its scene and drive its camera deterministically for capture.
const globe = Globe({
  animateIn: false, // forwarded to the internal ThreeGlobe; its intro tween would clobber our transform
  rendererConfig: { antialias: true, alpha: false, powerPreference: 'high-performance' },
})(document.getElementById('stage'))
  .width(W).height(H)
  .backgroundColor('#e9edf5')
  .enablePointerInteraction(false)
  .globeImageUrl('/scripts/marketing/textures/earth-blue-marble.jpg')
  .showAtmosphere(true)
  .atmosphereColor('#b7a6e8')
  .atmosphereAltitude(0.14)
  .arcsData(arcs)
  .arcColor('color')
  .arcStroke(0.25)
  .arcAltitudeAutoScale(0.22)
  .arcsTransitionDuration(0)
  .pointsData(SIGNALS.map(s => ({ lat: s.city[0], lng: s.city[1] })))
  .pointColor(() => '#c98a12')
  .pointAltitude(0.015)
  .pointRadius(0.5)
  .pointsTransitionDuration(0)
  .onGlobeReady(() => { tuneGlobeMat(0); });

const renderer = globe.renderer();
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = globe.scene();
const camera = globe.camera();
camera.fov = 38; camera.near = 3; camera.far = 4500; camera.updateProjectionMatrix();
globe.controls().enabled = false; // we drive the camera per frame; orbit update would fight __setT
// globe.gl adds its bright default lights (ambient 0xcccccc@PI + white directional) on its first tick;
// strip them once they appear (they wash out the scene; ours are below)
const stripDefaultLights = () => {
  for (const o of [...scene.children]) {
    if ((o.isAmbientLight && o.color.getHex() === 0xcccccc) || (o.isDirectionalLight && o.color.getHex() === 0xffffff && o.position.length() < 2)) scene.remove(o);
  }
};
globe.pauseAnimation(); // deterministic capture: frames rendered manually via _animationCycle()

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// the internal ThreeGlobe instance is added to the scene by globe.gl on its first tick, not at construction
let globeObj = null, globeChildrenBuilt = false;
const ensureGlobeObj = () => {
  if (!globeObj) {
    globeObj = scene.children.find(o => o.isGroup && !o.userData.fg && o.children.length > 5) || null;
    if (globeObj) {
      globeObj.position.set(1.6 * S, 0.15 * S, -3.72 * S);
      globeObj.rotation.z = -0.12;
      globeObj.scale.setScalar(0.94); // slight shrink so rotating labels stay inside the frame top
      stripDefaultLights();
      window.__globeObj = globeObj;
    }
  }
  if (globeObj && !globeChildrenBuilt) { globeChildrenBuilt = true; buildGlobeChildren(); }
  return globeObj;
};
window.__globe = globe; window.__scene = scene; window.__THREE = THREE;

// our bloom on top of globe.gl's own EffectComposer (created by three-render-objects)
globe.postProcessingComposer().addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.22, 0.4, 0.93));

// dim land so city lights carry the night-earth look; emissive keeps lights punchy
const tuneGlobeMat = (tries) => {
  const gm = globe.globeMaterial();
  if (gm && gm.map) {
    // texture load set color=null; multiply down to darken land, emissive keeps city lights punchy
    gm.color = new THREE.Color(0xffffff);
    gm.emissive = new THREE.Color(0xffffff);
    gm.emissiveMap = gm.map;
    gm.emissiveIntensity = 0.6;
    gm.needsUpdate = true;
    window.__setT(0);
    window.__ready = true;
  } else if (tries < 80) setTimeout(() => tuneGlobeMat(tries + 1), 250);
};

// lights: ambient/directional are scale-invariant; point intensities x S^2 (physical decay at S-times distances)
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const keyLight = new THREE.DirectionalLight(0xfff3d0, 1.0);
keyLight.position.set(4 * S, 5 * S, 6 * S);
scene.add(keyLight);
const edgeLight = new THREE.DirectionalLight(0xb7a6e8, 0.5);
edgeLight.position.set(-4 * S, 2 * S, -4 * S);
scene.add(edgeLight);

// ---------- labels + travelling pulses (children of the globe, local 100-unit space) ----------
const pulses = [];
function makeLabelSprite(title, sub) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 128;
  const ctx = cv.getContext('2d');
  ctx.textAlign = 'center';
  ctx.fillStyle = '#141c2e';
  ctx.font = '600 42px system-ui, -apple-system, sans-serif';
  ctx.fillText(title, 256, 52);
  ctx.fillStyle = '#4d5666';
  ctx.font = '400 31px system-ui, -apple-system, sans-serif';
  ctx.fillText(sub, 256, 98);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, toneMapped: false }));
  sp.scale.set(36, 9, 1);
  return sp;
}
function buildGlobeChildren() {
  SIGNALS.forEach((sig, i) => {
    const a3 = globe.getCoords(sig.city[0], sig.city[1], 0.01);
    const b3 = globe.getCoords(HUB[0], HUB[1], 0.01);
    const va = new THREE.Vector3(a3.x, a3.y, a3.z);
    const vb = new THREE.Vector3(b3.x, b3.y, b3.z);
    const mid = va.clone().add(vb).multiplyScalar(0.5).normalize().multiplyScalar(100 + va.distanceTo(vb) * 0.26 + 5);
    const curve = new THREE.QuadraticBezierCurve3(va, mid, vb);
    const spr = makeLabelSprite(sig.label, sig.sub);
    const lp = globe.getCoords(sig.city[0], sig.city[1], 0.055);
    spr.position.set(lp.x, lp.y, lp.z);
    globeObj.add(spr);
    const pulse = new THREE.Mesh(new THREE.SphereGeometry(1.1, 12, 8), new THREE.MeshBasicMaterial({ color: 0xf2bc4e, toneMapped: false }));
    globeObj.add(pulse);
    pulses.push({ curve, mesh: pulse, phase: i / SIGNALS.length });
  });
}

// ---------- queue face texture (transparent bg over glass, bright fine edges, inset amber key) ----------
function queueTexture() {
  const cv = document.createElement('canvas');
  cv.width = 2048; cv.height = 1400;
  const ctx = cv.getContext('2d');
  ctx.scale(2, 2);
  const sans = 'system-ui, -apple-system, sans-serif';
  const fg = '#0f172a', dim = '#3d4657', faint = '#6d7688';
  const hairline = 'rgba(15,23,42,0.16)';
  ctx.save();
  ctx.strokeStyle = 'rgba(124,90,143,0.6)';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = 'rgba(124,90,143,0.35)';
  ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.roundRect(8, 8, 1008, 684, 30); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = 'rgba(15,23,42,0.12)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(18, 18, 988, 664, 24); ctx.stroke();
  ctx.fillStyle = dim; ctx.font = `400 26px ${sans}`; ctx.fillText('✕', 56, 72);
  ctx.fillStyle = fg; ctx.font = `600 35px ${sans}`; ctx.fillText('Approval queue', 122, 76);
  ctx.fillStyle = faint; ctx.font = `500 24px ${sans}`;
  ctx.fillText('1 of 3', 640, 72); ctx.fillText('‹', 720, 72); ctx.fillText('›', 760, 72);
  ctx.font = `500 16px ${sans}`;
  const chip = 'ILLUSTRATIVE PREVIEW';
  const cw = ctx.measureText(chip).width + 28;
  ctx.strokeStyle = faint; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(970 - cw, 44, cw, 36, 18); ctx.stroke();
  ctx.fillStyle = dim; ctx.fillText(chip, 970 - cw + 14, 68);
  ctx.strokeStyle = hairline; ctx.beginPath(); ctx.moveTo(52, 106); ctx.lineTo(970, 106); ctx.stroke();
  ctx.fillStyle = faint; ctx.font = `500 22px ${sans}`; ctx.fillText('To', 56, 158);
  ctx.beginPath(); ctx.arc(162, 154, 29, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(139,124,246,0.35)'; ctx.fill();
  ctx.strokeStyle = 'rgba(139,124,246,0.6)'; ctx.stroke();
  ctx.fillStyle = '#f3e9ff'; ctx.font = `600 22px ${sans}`; ctx.fillText('JD', 149, 162);
  ctx.fillStyle = fg; ctx.font = `600 27px ${sans}`; ctx.fillText('Jordan Doe', 210, 150);
  ctx.fillStyle = dim; ctx.font = `400 22px ${sans}`;
  ctx.fillText('VP of Operations - horizon.example.com', 210, 180);
  ctx.fillStyle = faint; ctx.font = `500 22px ${sans}`; ctx.fillText('Company', 884, 158);
  ctx.strokeStyle = hairline; ctx.beginPath(); ctx.moveTo(52, 208); ctx.lineTo(970, 208); ctx.stroke();
  ctx.fillStyle = faint; ctx.font = `500 22px ${sans}`; ctx.fillText('Subject', 56, 258);
  ctx.fillStyle = fg; ctx.font = `600 27px ${sans}`; ctx.fillText('A faster way to scale your outbound', 162, 260);
  ctx.strokeStyle = hairline; ctx.beginPath(); ctx.moveTo(52, 286); ctx.lineTo(970, 286); ctx.stroke();
  ctx.fillStyle = '#232c3d'; ctx.font = `400 24px ${sans}`;
  const lines = [
    'Hi Jordan,', 0,
    'Noticed Horizon is expanding into new markets. We help', 52,
    'operations leaders turn buying signals into pipeline with', 86,
    'personalized outreach - and nothing goes out without human', 120,
    'approval.', 154,
    'Would you be open to a quick 15-minute chat next week?', 222,
    'Best, Taylor', 270,
  ];
  for (let i = 0; i < lines.length; i += 2) ctx.fillText(lines[i], 56, 330 + lines[i + 1]);
  ctx.strokeStyle = 'rgba(15,23,42,0.3)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(56, 622, 126, 50, 25); ctx.stroke();
  ctx.fillStyle = dim; ctx.font = `500 23px ${sans}`; ctx.fillText('✎ Edit', 86, 655);
  ctx.fillStyle = faint; ctx.font = `400 19px ${sans}`;
  ctx.fillText('⚿ Human approval required', 220, 653);
  // inset amber key
  const kx = 596, ky = 600, kw = 374, kh = 84;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.roundRect(kx - 6, ky - 6, kw + 12, kh + 12, 26); ctx.fill();
  ctx.strokeStyle = 'rgba(15,23,42,0.25)'; ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();
  const grad = ctx.createLinearGradient(0, ky, 0, ky + kh);
  grad.addColorStop(0, '#f2bc4e');
  grad.addColorStop(1, '#d3922a');
  ctx.save();
  ctx.shadowColor = 'rgba(240,190,90,0.55)';
  ctx.shadowBlur = 26;
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.roundRect(kx, ky, kw, kh, 20); ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(120,70,10,0.35)';
  ctx.beginPath(); ctx.roundRect(kx, ky, kw, 10, { tl: 20, tr: 20, bl: 0, br: 0 }); ctx.fill();
  ctx.fillStyle = 'rgba(255,244,214,0.55)';
  ctx.fillRect(kx + 18, ky + 3, kw - 36, 2);
  ctx.fillStyle = '#2a1c05';
  ctx.font = `800 34px ${sans}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('➤  Approve send', kx + kw / 2, ky + kh / 2 + 2);
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  const t = new THREE.CanvasTexture(cv);
  t.anisotropy = 8; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ---------- foreground composition group (scaled S so globe.gl keeps its native 100-unit globe) ----------
const fg = new THREE.Group();
fg.userData.fg = true;
fg.scale.setScalar(S);
scene.add(fg);

// ---------- translucent glass slab (dominant foreground) ----------
const slab = new THREE.Group();
slab.position.set(-0.35, -0.35, 1.3);
slab.rotation.set(-0.03, -0.34, 0.02);
{
  const panel = new THREE.Mesh(
    new RoundedBoxGeometry(5.1, 3.5, 0.16, 5, 0.1),
    new THREE.MeshPhysicalMaterial({
      color: 0xe8edf6, metalness: 0, roughness: 0.42,
      transmission: 0.55, thickness: 0.5, ior: 1.45,
      attenuationColor: 0xd7deeb, attenuationDistance: 1.8,
      clearcoat: 0.35, clearcoatRoughness: 0.3,
      envMapIntensity: 0.7, specularIntensity: 0.8,
    })
  );
  slab.add(panel);
  const face = new THREE.Mesh(
    new THREE.PlaneGeometry(4.75, 3.26),
    new THREE.MeshBasicMaterial({ map: queueTexture(), transparent: true, depthWrite: false, toneMapped: false })
  );
  face.position.set(0, 0.02, 0.09);
  slab.add(face);
}
fg.add(slab);

const rim = new THREE.PointLight(0xa78bfa, 3 * S * S, 0, 2);
rim.position.set(-5, 2.5, -3);
fg.add(rim);
const keyGlow = new THREE.PointLight(0xffca66, 0.18 * S * S, 2.2 * S, 2);
keyGlow.position.set(0.85, -1.05, 1.7);
fg.add(keyGlow);
const KEYGLOW_BASE = 0.14 * S * S, KEYGLOW_AMP = 0.2 * S * S;

// ---------- wet reflective floor ----------
{
  const mirror = new Reflector(new THREE.CircleGeometry(18, 48), {
    textureWidth: 1024, textureHeight: 1024, color: 0xdde3ee, clipBias: 0.003,
  });
  mirror.rotation.x = -Math.PI / 2;
  mirror.position.y = -2.75;
  fg.add(mirror);
  const cv = document.createElement('canvas');
  cv.width = cv.height = 512;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(256, 256, 30, 256, 256, 256);
  g.addColorStop(0, 'rgba(233,237,245,0.3)');
  g.addColorStop(0.6, 'rgba(233,237,245,0.6)');
  g.addColorStop(1, 'rgba(233,237,245,1)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 512);
  const tint = new THREE.Mesh(
    new THREE.CircleGeometry(18, 48),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false })
  );
  tint.rotation.x = -Math.PI / 2;
  tint.position.y = -2.745;
  fg.add(tint);
}

// ---------- starfield (point size x S: positions scale with fg, material size does not) ----------
{
  const r2 = seeded(424242);
  const spts = [];
  for (let i = 0; i < 700; i++) {
    const r = 26 + r2() * 34;
    const a = r2() * Math.PI * 2, b = Math.acos(2 * r2() - 1);
    const x = r * Math.sin(b) * Math.cos(a), y = r * Math.cos(b), z = r * Math.sin(b) * Math.sin(a);
    if (z > 6) continue;
    spts.push(x, y, z);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(spts), 3));
  fg.add(new THREE.Points(sg, new THREE.PointsMaterial({
    color: 0x8fa0c8, size: 0.09 * S, transparent: true, opacity: 0.4, sizeAttenuation: true, depthWrite: false,
  })));
}

// ---------- deterministic frame hook: drive globe.gl's own render cycle manually ----------
window.__setT = (t) => {
  const g = ensureGlobeObj();
  stripDefaultLights();
  if (g) g.rotation.y = t * (Math.PI * 2 / LOOP);
  const breathe = 0.5 + 0.5 * Math.sin(t * (Math.PI * 2 / 5));
  keyGlow.intensity = KEYGLOW_BASE + breathe * KEYGLOW_AMP;
  for (const p of pulses) {
    const u = (t / 5 + p.phase) % 1;
    p.mesh.position.copy(p.curve.getPoint(u));
  }
  camera.position.x = 0.3 * S * Math.sin(t * (Math.PI * 2 / LOOP));
  camera.position.y = (0.55 + 0.07 * Math.sin(t * (Math.PI * 2 / LOOP) * 2)) * S;
  camera.position.z = 9.8 * S;
  camera.lookAt(0.1 * S, -0.15 * S, 0);
  globe._animationCycle();  // renders one frame via globe.gl's own tick (composer incl. our bloom pass)
  globe.pauseAnimation();   // cancel the RAF it just scheduled; keeps capture deterministic
};
window.__setT(0);
// readiness: onGlobeReady fires tuneGlobeMat which sets __ready; fallbacks below
const imgProbe = new Image();
imgProbe.onload = () => { tuneGlobeMat(0); };
imgProbe.onerror = () => { window.__ready = true; };
imgProbe.src = '/scripts/marketing/textures/earth-blue-marble.jpg';
setTimeout(() => { window.__ready = true; }, 15000);
</script>
</body>
</html>
